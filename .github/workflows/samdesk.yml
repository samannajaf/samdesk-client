name: SamDesk Windows build

# Builds the SamDesk customer (incoming only) and support (outgoing only) clients,
# 32-bit and 64-bit, with the Sciter UI and the Rust toolchain upstream uses for
# its Windows 7 compatible Sciter build.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to build"
        type: choice
        default: all
        options: [all, windows, android]
  push:
    branches: [master, main]

env:
  LLVM_VERSION: "15.0.6"
  SCITER_TOOLCHAIN: "nightly-2023-10-13"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # Android (support-only client) — mirrors upstream build-rustdesk-android
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  ANDROID_RUST_VERSION: "1.75"
  VERSION: "1.5.1"

jobs:
  ticket-tests:
    name: Ticket verification unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Test src/samdesk/ticket.rs in isolation
        shell: bash
        run: |
          mkdir -p /tmp/tt/shim/src /tmp/tt/t/src
          printf '[package]\nname = "hbb_common"\nversion = "0.1.0"\nedition = "2021"\n[dependencies]\nbase64 = "0.22"\nsodiumoxide = "0.2"\nserde_json = "1"\n' > /tmp/tt/shim/Cargo.toml
          echo 'pub use base64; pub use sodiumoxide; pub use serde_json;' > /tmp/tt/shim/src/lib.rs
          printf '[package]\nname = "t"\nversion = "0.1.0"\nedition = "2021"\n[dependencies]\nhbb_common = { path = "../shim" }\n' > /tmp/tt/t/Cargo.toml
          echo "#[path = \"$GITHUB_WORKSPACE/src/samdesk/ticket.rs\"] pub mod ticket;" > /tmp/tt/t/src/lib.rs
          cd /tmp/tt/t && cargo test

  build:
    # Windows exes are already built; only rebuild on an explicit dispatch so
    # ordinary pushes (e.g. Android iteration) don't burn Windows CI minutes.
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'windows') }}
    name: ${{ matrix.role }} ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        role: [customer, support]
        include:
          - arch: x86
            target: i686-pc-windows-msvc
            triplet: x86-windows-static
            sciter_dir: x32
            suffix: "-x86"
          - arch: x64
            target: x86_64-pc-windows-msvc
            triplet: x64-windows-static
            sciter_dir: x64
            suffix: ""
          - role: customer
            out_name: SamDesk.Customer
          - role: support
            out_name: SamDesk.Support
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang (32-bit)
        if: matrix.arch == 'x86'
        uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install LLVM and Clang (64-bit)
        if: matrix.arch == 'x64'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install ${{ env.SCITER_TOOLCHAIN }}-${{ matrix.target }} \
            --target ${{ matrix.target }} --component rustfmt \
            --profile minimal --no-self-update --force-non-host
          rustup default ${{ env.SCITER_TOOLCHAIN }}-${{ matrix.target }} --force-non-host

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: samdesk-sciter-${{ matrix.arch }}-${{ matrix.role }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet ${{ matrix.triplet }} --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "== $f"; tail -n 50 "$f"; done
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          python3 res/samdesk_brand.py
          python3 res/inline-sciter.py
          if [ "${{ matrix.arch }}" = "x86" ]; then
            sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
            cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e
          fi
          # curve25519-dalek 4.1.3 needs the renamed stdarch_x86_avx512 feature,
          # which the pinned Sciter nightly (2023-10-13) does not have; 4.1.1 uses
          # the stdsimd feature that this toolchain still ships.
          cargo update -p curve25519-dalek --precise 4.1.1
          set -o pipefail
          if ! cargo build --locked --release --bins --features inline,vram,hwcodec,samdesk_${{ matrix.role }} 2>&1 | tee build.log; then
            block=$(awk 'tolower($0) ~ /^error/{f=1} f{print}' build.log | head -c 3000)
            enc=$(printf '%s' "$block" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${enc}"
            exit 1
          fi
          mkdir -p ./Release
          mv ./target/release/rustdesk.exe ./Release/rustdesk.exe
          curl -fLJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/${{ matrix.sciter_dir }}/sciter.dll

      - name: Build self-extracting executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -e ../../Release/rustdesk.exe
          popd
          mkdir -p ./Output
          mv ./target/release/rustdesk-portable-packer.exe "./Output/${{ matrix.out_name }}${{ matrix.suffix }}.exe"
          sha256sum ./Output/*.exe | tee ./Output/SHA256SUMS-${{ matrix.role }}-${{ matrix.arch }}.txt

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.out_name }}${{ matrix.suffix }}
          path: Output

  # flutter_rust_bridge codegen, shared with upstream; produces bridge-artifact.
  samdesk-bridge:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'android')) }}
    uses: ./.github/workflows/bridge.yml

  # SamDesk support client for Android (outgoing only, enforced by the samdesk
  # conn-type lock in src/samdesk). arm64-v8a only for now — the ABI that covers
  # the large majority of phones; armv7/x86_64 can be added once this is green.
  android-support:
    needs: [samdesk-bridge]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'android')) }}
    name: android support arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang cmake curl gcc-multilib git g++ g++-multilib \
               libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
               libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
               libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
               openjdk-17-jdk-headless pkg-config tree wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          chmod +x ./flutter/*.sh || true
          if ! bash ./flutter/build_android_deps.sh arm64-v8a 2>&1 | tee vcpkgdeps.log; then
            tail=$( { find "${VCPKG_ROOT}/" -name "*.log" -exec tail -n 60 {} \; 2>/dev/null; tail -n 60 vcpkgdeps.log; } | tail -c 3000)
            enc=$(printf '%s' "$tail" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${enc}"
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.ANDROID_RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: samdesk-android-arm64

      - name: Build rustdesk lib (samdesk_support)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          python3 res/samdesk_brand.py
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          set -o pipefail
          if ! cargo ndk --platform 21 --target aarch64-linux-android build --locked --release \
               --features flutter,hwcodec,samdesk_support 2>&1 | tee build.log; then
            block=$(awk 'tolower($0) ~ /^error/{f=1} f{print}' build.log | head -c 3000)
            enc=$(printf '%s' "$block" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${enc}"
            exit 1
          fi
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Prepare signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_STOREPASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/samdesk-release.jks"
            {
              echo "storePassword=$KS_STOREPASS"
              echo "keyPassword=$KS_KEYPASS"
              echo "keyAlias=$KS_ALIAS"
              echo "storeFile=$GITHUB_WORKSPACE/samdesk-release.jks"
            } > flutter/android/key.properties
            echo "SAMDESK_SIGNING=release" >> "$GITHUB_ENV"
          else
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
            echo "SAMDESK_SIGNING=debug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          popd
          mkdir -p ./Output
          cp ./flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "./Output/SamDesk.Support-android-arm64.apk"
          ( cd ./Output && sha256sum *.apk | tee SHA256SUMS-android-arm64.txt )
          echo "APK signed with: $SAMDESK_SIGNING"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SamDesk.Support-android-arm64
          path: Output
