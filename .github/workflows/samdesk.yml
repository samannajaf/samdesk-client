name: SamDesk Windows build

# Builds the SamDesk customer (incoming only) and support (outgoing only) clients.
# Windows now uses the FULL Flutter UI (same as upstream RustDesk releases), so the
# client ships with every RustDesk feature plus the SamDesk role lock / signed-ticket
# gate. Only x64 is built: Flutter has no 32-bit (i686) Windows target.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to build"
        type: choice
        default: all
        options: [all, windows, android]
  push:
    branches: [master, main]

env:
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_RUST_VERSION: "1.75"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # Android (support-only client) — mirrors upstream build-rustdesk-android
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  ANDROID_RUST_VERSION: "1.75"
  VERSION: "1.5.1"

jobs:
  ticket-tests:
    name: Ticket verification unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Test src/samdesk/ticket.rs in isolation
        shell: bash
        run: |
          mkdir -p /tmp/tt/shim/src /tmp/tt/t/src
          printf '[package]\nname = "hbb_common"\nversion = "0.1.0"\nedition = "2021"\n[dependencies]\nbase64 = "0.22"\nsodiumoxide = "0.2"\nserde_json = "1"\n' > /tmp/tt/shim/Cargo.toml
          echo 'pub use base64; pub use sodiumoxide; pub use serde_json;' > /tmp/tt/shim/src/lib.rs
          printf '[package]\nname = "t"\nversion = "0.1.0"\nedition = "2021"\n[dependencies]\nhbb_common = { path = "../shim" }\n' > /tmp/tt/t/Cargo.toml
          echo "#[path = \"$GITHUB_WORKSPACE/src/samdesk/ticket.rs\"] pub mod ticket;" > /tmp/tt/t/src/lib.rs
          cd /tmp/tt/t && cargo test

  # flutter_rust_bridge codegen, shared with upstream; produces bridge-artifact.
  # Needed by both the Windows Flutter build and the Android build.
  samdesk-bridge:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'windows' || inputs.scope == 'android')) }}
    uses: ./.github/workflows/bridge.yml

  build:
    # Full-featured Flutter Windows build (x64) for both roles. Rebuilt only on an
    # explicit windows/all dispatch so ordinary pushes don't burn Windows CI minutes.
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'windows') }}
    needs: [samdesk-bridge]
    name: ${{ matrix.role }} x64 flutter
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        role: [customer, support]
        include:
          - role: customer
            out_name: SamDesk.Customer
          - role: support
            out_name: SamDesk.Support
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.FLUTTER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: samdesk-flutter-win-x64-${{ matrix.role }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "== $f"; tail -n 50 "$f"; done
            exit 1
          fi

      - name: Build librustdesk with the SamDesk role lock
        shell: bash
        run: |
          python3 res/samdesk_brand.py
          set -o pipefail
          # The role feature (samdesk_customer / samdesk_support) is baked into the Flutter
          # cdylib here; build.py then runs `flutter build windows` against it via --skip-cargo,
          # so the upstream packaging path stays untouched.
          if ! cargo build --locked --release --lib --features flutter,hwcodec,vram,samdesk_${{ matrix.role }} 2>&1 | tee build.log; then
            block=$(awk 'tolower($0) ~ /^error/{f=1} f{print}' build.log | head -c 3000)
            enc=$(printf '%s' "$block" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${enc}"
            exit 1
          fi

      - name: Build Flutter Windows app and bundle
        shell: bash
        run: |
          set -o pipefail
          if ! python3 ./build.py --portable --flutter --skip-portable-pack --skip-cargo --hwcodec --vram 2>&1 | tee flutter.log; then
            enc=$(tail -c 3000 flutter.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${enc}"
            exit 1
          fi
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Add virtual display driver
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ -n "$runner_res" ]; then cp "$runner_res" ./libs/portable/Runner.res; fi

      - name: Build self-extracting executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./Output
          mv ./target/release/rustdesk-portable-packer.exe "./Output/${{ matrix.out_name }}.exe"
          sha256sum ./Output/*.exe | tee ./Output/SHA256SUMS-${{ matrix.role }}-x64.txt

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2
        with:
          msbuild-architecture: x86

      - name: Build MSI installer (SamDesk-branded)
        shell: pwsh
        run: |
          # The MSI product/exe is named "SamDesk" (not rustdesk), so the installed
          # product, Program Files folder and shortcut all read SamDesk. The portable
          # packer above already embedded the folder, so renaming here only affects the MSI.
          Move-Item -Force ./rustdesk/rustdesk.exe ./rustdesk/SamDesk.exe
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk --app-name SamDesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          popd
          $msi = Get-ChildItem ./res/msi/Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          if (-not $msi) { Write-Error "MSI not produced"; exit 1 }
          Move-Item -Force $msi.FullName "./Output/${{ matrix.out_name }}.msi"
          Get-ChildItem ./Output | Format-Table Name,Length

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.out_name }}
          path: Output

  # 32-bit Windows (i686) for both roles via the legacy Sciter UI. Flutter has no
  # 32-bit Windows target, so this is the fallback for Windows 7 / older 32-bit
  # systems. Adapted from upstream build-for-windows-sciter, with the SamDesk brand
  # (res/samdesk_brand.py) and the role lock (samdesk_${role} feature) applied; the
  # lock lives in shared code (src/server/connection.rs, src/client.rs, …) so it is
  # enforced the same as in the Flutter build. No Flutter engine/bridge is involved.
  build-sciter:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'windows') }}
    name: ${{ matrix.role }} x86 sciter
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        role: [customer, support]
        include:
          - role: customer
            out_name: SamDesk.Customer-x86
          - role: support
            out_name: SamDesk.Support-x86
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang (32-bit)
        uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce # commit 2026-05-26
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain (nightly i686, for Sciter abi_thiscall)
        shell: bash
        run: |
          rustup toolchain install nightly-2023-10-13-i686-pc-windows-msvc \
            --target i686-pc-windows-msvc --component rustfmt \
            --profile minimal --no-self-update --force-non-host
          rustup default nightly-2023-10-13-i686-pc-windows-msvc --force-non-host

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: samdesk-sciter-win-x86-${{ matrix.role }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (x86-windows-static)
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x86-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x86-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "== $f"; tail -n 50 "$f"; done
            exit 1
          fi

      - name: Build SamDesk (Sciter, i686) with the role lock
        shell: bash
        run: |
          python3 res/samdesk_brand.py
          python3 res/inline-sciter.py
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e
          set -o pipefail
          if ! cargo build --locked --features inline,vram,hwcodec,samdesk_${{ matrix.role }} --release --bins 2>&1 | tee build.log; then
            block=$(awk 'tolower($0) ~ /^error/{f=1} f{print}' build.log | head -c 3000)
            enc=$(printf '%s' "$block" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${enc}"
            exit 1
          fi
          mkdir -p ./Release
          mv ./target/release/rustdesk.exe ./Release/rustdesk.exe
          curl -LJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll
          curl -LJ -o ./usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip usbmmidd_v2.zip
          rm -rf ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release || true

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ -n "$runner_res" ]; then cp "$runner_res" ./libs/portable/Runner.res; fi

      - name: Build self-extracting executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -e ../../Release/rustdesk.exe
          popd
          mkdir -p ./Output
          mv ./target/release/rustdesk-portable-packer.exe "./Output/${{ matrix.out_name }}.exe"
          sha256sum ./Output/*.exe | tee ./Output/SHA256SUMS-${{ matrix.role }}-x86.txt

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.out_name }}
          path: Output

  # SamDesk support client for Android (outgoing only, enforced by the samdesk
  # conn-type lock in src/samdesk). arm64-v8a only for now — the ABI that covers
  # the large majority of phones; armv7/x86_64 can be added once this is green.
  android-support:
    needs: [samdesk-bridge]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.scope == 'all' || inputs.scope == 'android')) }}
    name: android support arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang cmake curl gcc-multilib git g++ g++-multilib \
               libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev \
               libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev \
               libxcb-xfixes0-dev libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
               openjdk-17-jdk-headless pkg-config tree wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          chmod +x ./flutter/*.sh || true
          if ! bash ./flutter/build_android_deps.sh arm64-v8a 2>&1 | tee vcpkgdeps.log; then
            tail=$( { find "${VCPKG_ROOT}/" -name "*.log" -exec tail -n 60 {} \; 2>/dev/null; tail -n 60 vcpkgdeps.log; } | tail -c 3000)
            enc=$(printf '%s' "$tail" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${enc}"
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.ANDROID_RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: samdesk-android-arm64

      - name: Build rustdesk lib (samdesk_support)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          python3 res/samdesk_brand.py
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          set -o pipefail
          if ! cargo ndk --platform 21 --target aarch64-linux-android build --locked --release \
               --features flutter,hwcodec,samdesk_support 2>&1 | tee build.log; then
            block=$(awk 'tolower($0) ~ /^error/{f=1} f{print}' build.log | head -c 3000)
            enc=$(printf '%s' "$block" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${enc}"
            exit 1
          fi
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Prepare signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_STOREPASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/samdesk-release.jks"
            {
              echo "storePassword=$KS_STOREPASS"
              echo "keyPassword=$KS_KEYPASS"
              echo "keyAlias=$KS_ALIAS"
              echo "storeFile=$GITHUB_WORKSPACE/samdesk-release.jks"
            } > flutter/android/key.properties
            echo "SAMDESK_SIGNING=release" >> "$GITHUB_ENV"
          else
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
            echo "SAMDESK_SIGNING=debug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          cp ./target/aarch64-linux-android/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          popd
          mkdir -p ./Output
          cp ./flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "./Output/SamDesk.Support-android-arm64.apk"
          ( cd ./Output && sha256sum *.apk | tee SHA256SUMS-android-arm64.txt )
          echo "APK signed with: $SAMDESK_SIGNING"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SamDesk.Support-android-arm64
          path: Output
