name: SamDesk publish dist

# Re-publishes already-built support binaries from a given run into the `dist`
# branch, so they can be fetched by a plain git clone (no artifact/blob access).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Source run id that holds the SamDesk.Support artifacts
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built artifacts from the source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p /tmp/art
          # Unified single-app artifacts. x86 (Sciter) and android are optional.
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -n SamDesk         -D /tmp/art/win64
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -n SamDesk-x86      -D /tmp/art/win86    || echo "no x86 artifact"
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -n SamDesk-android  -D /tmp/art/android  || echo "no android artifact"
          find /tmp/art -type f -printf '%s\t%p\n'
      - name: Push binaries into the dist branch
        run: |
          set -eux
          mkdir -p /tmp/apps
          find /tmp/art/win64 -iname '*.exe' -exec cp {} /tmp/apps/SamDesk.exe \;
          find /tmp/art/win64 -iname '*.msi' -exec cp {} /tmp/apps/SamDesk.msi \; || true
          [ -d /tmp/art/win86 ]   && find /tmp/art/win86   -iname '*.exe' -exec cp {} /tmp/apps/SamDesk-x86.exe \; || true
          [ -d /tmp/art/android ] && find /tmp/art/android -iname '*.apk' -exec cp {} /tmp/apps/SamDesk.apk \; || true
          ls -la /tmp/apps
          git config user.name  "samdesk-ci"
          git config user.email "ci@samdesk.local"
          git checkout --orphan dist
          git rm -rf . >/dev/null 2>&1 || true
          rm -rf apps && mkdir -p apps
          cp /tmp/apps/* apps/
          printf 'binaries republished from run %s\n' "${{ inputs.run_id }}" > apps/README.txt
          git add -f apps
          git commit -m "dist: unified SamDesk binaries from run ${{ inputs.run_id }}"
          git push -f origin dist
